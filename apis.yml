name: Indigo Agriculture
kind: company
description: 'Indigo Agriculture is a Boston-based agriculture-technology company combining microbial
  seed and foliar treatments (biotrinsic) and on-farm seed treatment hardware (CLIPS) with two large supply-chain
  programs: Carbon by Indigo, a soil-carbon program that pays growers for verified carbon credits using
  Indigo''s proprietary measurement, reporting, and verification (MRV) stack; and Source by Indigo, a
  Scope-3 program that connects consumer-goods buyers to sustainably grown crops with greenhouse-gas,
  water, and low-carbon-biofuel outcome reporting. Indigo does not publish a public developer portal;
  partner and supply-chain integrations are negotiated directly through their team.'
