- aid: indigo-ag:clips-device
  name: CLIPS Seed-Treatment Device
  description: On-farm seed-treatment application hardware used to apply biotrinsic products to seed prior
    to planting. Hardware product, not an API.
  humanURL: https://www.indigoag.com/clips
