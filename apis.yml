apis:
- aid: indigo-ag:carbon-program
  name: Carbon by Indigo
  description: Soil-carbon program that enrolls growers, captures on-farm management practice data, and
    uses Indigo's MRV engine to quantify and verify soil organic-carbon outcomes that are sold as carbon
    credits to corporate buyers. The customer-facing surface is the Indigo grower app at app.indigoag.com;
    partner / buyer integrations are arranged directly.
  humanURL: https://www.indigoag.com/carbon
  baseURL: https://app.indigoag.com/
  tags:
  - Carbon Credits
  - Soil Carbon
  - MRV
  - Grower Program
  properties:
  - type: Information
    url: https://www.indigoag.com/carbon
  - type: GrowerApp
    url: https://app.indigoag.com/
  - type: Calculator
    url: https://carbon.indigoag.net/how-much-can-i-earn-carbon-farming
- aid: indigo-ag:source
  name: Source by Indigo
  description: Scope-3 supply-chain program for consumer goods and biofuel companies. Designs and runs
    grower programs aligned with the GHG Protocol, collects and verifies field-level data via Indigo's
    MRV engine, and reports emissions, water, and low-carbon-biofuel outcomes back to the buyer. Delivered
    as a managed service; integration with buyer systems is arranged on a contract basis.
  humanURL: https://www.indigoag.com/sustainable-sourcing
  baseURL: https://www.indigoag.com/sustainable-sourcing
  tags:
  - Scope 3
  - Sustainability
  - Supply Chain
  - MRV
  properties:
  - type: Information
    url: https://www.indigoag.com/sustainable-sourcing
- aid: indigo-ag:biotrinsic
  name: biotrinsic Microbial Treatments
  description: Indigo's portfolio of microbial seed and foliar treatments, sold to growers and ag retailers.
    Product line, not an API; included so the apis.yml reflects Indigo's complete commercial surface.
  humanURL: https://www.indigoag.com/biotrinsic
  baseURL: https://www.indigoag.com/biotrinsic
